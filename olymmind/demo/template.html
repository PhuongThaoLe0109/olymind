<title>OlymMind</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* Bố cục: sân khấu tối giống trường quay. Nền núi đa giác chuyển động, tấm nội dung vát góc viền vàng ở giữa, bốn bàn thí sinh ở dưới. */
:root{
  --bg:#1E0826; --ink:#FFF4D6; --muted:#C9AEC8; --gold1:#FFE9A8; --gold2:#F2BE48; --gold3:#B7791F;
  --panel:rgba(32,8,42,.66); --panel2:rgba(255,255,255,.07); --line:rgba(242,190,72,.55);
  --bell:#E5322D; --ok:#7BE0A0;
  --font:"Source Sans 3","Segoe UI",Tahoma,sans-serif;
  --goldtext:linear-gradient(180deg,var(--gold1) 0%,var(--gold2) 55%,var(--gold3) 100%);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.45;
  padding-block:18px 36px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block}
.wrap{position:relative;z-index:1;max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:12px;min-height:calc(100vh - 54px)}
h1,h2,h3{margin:0;text-wrap:balance}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--gold1);outline-offset:2px}
.gt{background:var(--goldtext);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;filter:drop-shadow(0 2px 6px rgba(0,0,0,.45))}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:22px;line-height:1;letter-spacing:.01em}
.brand svg{width:40px;height:40px;filter:drop-shadow(0 0 8px rgba(255,214,120,.55))}
.brand small{display:block;font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);-webkit-text-fill-color:var(--muted)}
.spacer{flex:1}
.chip{display:inline-block;padding:2px 12px;border:1px solid rgba(242,190,72,.35);border-radius:99px;font-size:13px;font-weight:600;color:var(--gold1)}
.chip.bad{color:#FF9B96;border-color:rgba(255,155,150,.5)}
.rounds{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;border-bottom:1px solid rgba(242,190,72,.25)}
.rounds div{padding:8px 6px;font-size:14px;font-weight:600;color:var(--muted);text-align:center;position:relative}
.rounds div.on{color:var(--gold1)}
.rounds div.on::after{content:"";position:absolute;left:12%;right:12%;bottom:-1px;height:3px;background:var(--goldtext);border-radius:3px}
.rounds div.done{color:var(--ok)}
.frame{position:relative;padding:34px 42px;flex:1;display:flex;flex-direction:column}
.frame>.stage{position:relative;z-index:1;flex:1}
.stage>.card:not(.gold){flex:1;justify-content:center}
#lau{position:absolute;left:0;top:0;z-index:0;pointer-events:none;overflow:visible}
.stage{display:flex;flex-direction:column;gap:12px}
.tline{display:flex;align-items:center;gap:12px}
.tline .bar{flex:1}
.tline .time{min-width:64px}
.card.lobby{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:20px 28px;align-items:center}
.lobby .l{display:flex;flex-direction:column;gap:12px}
.lobby .l .big{text-align:left}
.lobby .l .hint{text-align:left}
.rules{counter-reset:r;list-style:none;padding:0}
.rules li{counter-increment:r;display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;margin-bottom:6px}
.rules li::before{content:counter(r);font-weight:700;color:#3A1A00;background:var(--goldtext);width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:13px}
.rules b{color:var(--gold1)}
.card{position:relative;background:var(--panel);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);padding:clamp(16px,2.4vw,32px) clamp(20px,3vw,44px);display:flex;flex-direction:column;gap:clamp(12px,3vh,34px);min-width:0;
  clip-path:polygon(18px 0,100% 0,100% calc(100% - 18px),calc(100% - 18px) 100%,0 100%,0 18px);
  box-shadow:inset 0 0 0 1.5px var(--line)}
.card.gold{background:linear-gradient(135deg,rgba(242,190,72,.2),rgba(32,8,42,.7))}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:clamp(16px,2.2vh,20px)}
.q{font-size:clamp(24px,min(3.4vw,5vh),52px);font-weight:700;line-height:1.3;margin:0;text-wrap:pretty}
.pts{margin-left:auto;font-weight:700;font-size:18px;font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:var(--goldtext);transform-origin:left}
.bar.urgent i{background:var(--bell)}
.time{font-weight:700;text-align:right;font-size:15px;font-variant-numeric:tabular-nums;color:var(--gold1)}
.btn{border:0;padding:clamp(12px,1.8vh,18px) 26px;font-weight:700;font-size:clamp(17px,2.4vh,22px);color:#3A1A00;background:var(--goldtext);
  clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%);transition:filter .15s}
.btn:hover{filter:brightness(1.1)}
.btn.ghost{background:rgba(255,255,255,.12);color:var(--ink)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>input{flex:1;min-width:0}
input[type=text]{width:100%;padding:clamp(12px,1.8vh,18px) 16px;font-size:clamp(17px,2.4vh,22px);border:1.5px solid rgba(242,190,72,.45);background:rgba(10,2,18,.55);color:var(--ink);font:inherit;border-radius:4px}
input[type=text]::placeholder{color:#A98BA9}
.bell{align-self:center;width:clamp(132px,20vh,200px);height:clamp(132px,20vh,200px);border-radius:50%;border:3px solid var(--gold1);background:radial-gradient(circle at 35% 30%,#FF6A5E,var(--bell) 60%,#8E1414);color:#fff;display:grid;place-items:center;box-shadow:0 0 40px rgba(229,50,45,.55)}
.bell:active{transform:scale(.93)}
.bell:disabled{opacity:.35;box-shadow:none}
.bell svg{width:54px;height:54px}
.hint{font-size:14px;color:var(--muted);text-align:center;margin:0}
.big{font-size:clamp(34px,4vw,54px);font-weight:700;text-align:center;margin:0;line-height:1.15}
.items{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px;margin:0;padding:0;list-style:none}
.items li{background:var(--panel2);padding:8px 12px;font-weight:600;border-left:3px solid var(--gold2)}
.items b{color:var(--gold1);margin-right:8px}
.qimg{align-self:center;max-height:220px;background:#fff;border-radius:4px}
.cells{display:flex;flex-wrap:wrap;gap:14px;justify-content:center}
.cells div{display:flex;gap:4px}
.cells span{width:38px;height:44px;display:grid;place-items:center;border:2px solid var(--gold2);background:rgba(10,2,18,.5);font-weight:700;font-size:22px;text-transform:uppercase;color:var(--gold1)}
.hid{position:relative;width:min(300px,100%);aspect-ratio:3/2;overflow:hidden;background:#fff;align-self:center}
.hid img{width:100%;height:100%;object-fit:contain;max-width:none}
.hid i{position:absolute;background:#2A0B3A;border:1px solid var(--gold2);transition:opacity .5s}
.hid i.open{opacity:0}
.rowsl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;font-size:clamp(16px,2.2vh,20px)}
.rowsl li{padding:8px 12px;background:var(--panel2)}
.rowsl li.on{background:rgba(242,190,72,.18);font-weight:600}
.rowsl b{color:var(--gold1);margin-right:6px}
.pick{display:flex;flex-direction:column;gap:8px}
.pick div{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pick .btn{padding:6px 16px}
.rank{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.rank li{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;background:rgba(242,190,72,.14);padding:8px 14px;font-weight:600;border-left:3px solid var(--gold2)}
.center{text-align:center;align-items:stretch}
.cfg{display:flex;flex-direction:column;gap:12px;max-width:420px;width:100%;margin:0 auto}
select{padding:9px;border:1.5px solid rgba(242,190,72,.45);background:rgba(10,2,18,.7);color:var(--ink);font:inherit;border-radius:4px}
.rules{font-size:17px;color:var(--muted);display:grid;gap:4px;margin:0;padding-left:18px;text-align:left}
.seats{display:block}
.plate{display:flex;align-items:center;gap:14px;padding:10px 20px;background:linear-gradient(180deg,rgba(60,16,70,.85),rgba(24,6,34,.92));box-shadow:inset 0 2px 0 var(--gold1);clip-path:polygon(0 0,100% 0,calc(100% - 14px) 100%,14px 100%)}
.plate span{font-weight:600;font-size:17px;color:var(--ink)}
.plate .sc{margin-left:auto;font-size:clamp(34px,4vw,48px);font-weight:700;line-height:1}
.plate .btn{padding:8px 18px;font-size:15px}
.rlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.rd{display:flex;gap:12px;align-items:flex-start;padding:10px 14px;background:var(--panel2);border-left:3px solid var(--gold2);cursor:pointer;font-size:16px;color:var(--muted)}
.rd b{display:block;color:var(--gold1)}
.rd input{margin-top:5px;width:18px;height:18px;accent-color:#F2BE48}
.seat{position:relative;padding:12px 14px 14px;min-width:0;background:linear-gradient(180deg,rgba(60,16,70,.85),rgba(24,6,34,.92));
  clip-path:polygon(0 0,100% 0,calc(100% - 14px) 100%,14px 100%);text-align:center;box-shadow:inset 0 2px 0 rgba(242,190,72,.5)}
.seat.me{box-shadow:inset 0 3px 0 var(--gold1)}
.seat.turn{background:linear-gradient(180deg,rgba(130,60,20,.85),rgba(60,20,20,.92))}
.seat.buzz{background:linear-gradient(180deg,rgba(190,40,40,.9),rgba(70,10,20,.95))}
.seat .nm{font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
.seat .sc{font-weight:700;font-size:clamp(30px,3.4vw,44px);line-height:1.1;font-variant-numeric:tabular-nums}
.seat .el{font-size:12px;color:var(--muted)}
.mark{display:block;font-size:12px;font-weight:600;color:var(--ok)}
.given{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.given li{padding:4px 12px;background:var(--panel2);font-size:15px;border-left:3px solid var(--gold2)}
.given li.ok{border-left-color:var(--ok)}
.given li.no{border-left-color:#FF9B96}
.given li span{font-weight:700;margin-left:6px}
.given li.ok span{color:var(--ok)}
.given li.no span{color:#FF9B96}
.foot{font-size:13px;color:var(--muted);text-align:center;margin:0}
@media(max-width:700px){.lobby{grid-template-columns:1fr}.lobby .l .big{text-align:center}.lobby .l .hint{text-align:center}}
@media(max-width:560px){.plate span{font-size:15px}.row>input{flex:1 1 100%}.frame{padding:26px 26px}.seats{grid-template-columns:repeat(2,minmax(0,1fr))}.q{font-size:20px}.rounds div{font-size:12px;padding:6px 2px}.big{font-size:30px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<canvas id="bg" aria-hidden="true"></canvas>
<div class="wrap">
  <div class="top">
    <div class="brand">
      <svg viewBox="0 0 64 64" aria-hidden="true"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE9A8"/><stop offset=".6" stop-color="#F2BE48"/><stop offset="1" stop-color="#B7791F"/></linearGradient></defs><g fill="url(#g)"><path d="M10 40C8 28 14 16 26 10c-6 6-8 16-6 26z"/><path d="M54 40c2-12-4-24-16-30 6 6 8 16 6 26z"/><path d="M18 50c-5-2-8-6-9-10 4 3 9 4 13 3zM46 50c5-2 8-6 9-10-4 3-9 4-13 3z"/><path d="M22 48l10-26 10 26-6-6-4 8-4-8z"/></g></svg>
      <div><span class="gt">OlymMind</span><small>Luyện thi Olympia</small></div>
    </div>
    <span class="spacer"></span>
    <span class="chip">Ôn một mình</span>
  </div>
  <div class="rounds" id="rounds"></div>
  <div class="frame" id="frame"><svg id="lau" aria-hidden="true"></svg><div class="stage" id="main"></div></div>
  <div class="seats" id="seats"></div>
  <p class="foot">Câu hỏi là bộ mẫu soạn tay; luật theo mùa 24–26, một vài chi tiết là giả định.</p>
</div>

<script>__BUNDLE__</script>
<script>
(function(){
"use strict";
var O=window.Olym, esc=function(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})};
var BELL='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"/></svg>';
var speed=0.6, eng=null, code="", meId="", st=null, lastSig="", picked=[0,1,2,3];
var $main=document.getElementById("main"), $seats=document.getElementById("seats"), $rounds=document.getElementById("rounds");
function hub(){return{emit:function(c,ev,p){ if(ev==="room:state"){st=p;onState();} }}}

function lobby(){
  if(eng&&code) eng.destroy(code);
  eng=null; st=null; lastSig="";
  $seats.innerHTML=""; $rounds.innerHTML="";
  var R=O.ROUND_ORDER.map(function(k,i){return'<li><label class="rd"><input type="checkbox" data-r="'+i+'" '+(picked.indexOf(i)>=0?"checked":"")+'><span><b>Vòng '+(i+1)+': '+O.ROUND_LABEL[k]+'</b>'+esc(O.ROUND_RULE_TEXT[k])+'</span></label></li>'}).join("");
  $main.innerHTML='<div class="card lobby"><div class="l"><h1 class="big gt">Đường lên đỉnh Olympia</h1>'+
   '<p class="hint">Tự ôn luyện một mình. Chọn các vòng muốn ôn, câu nào chưa đúng sẽ hiện đáp án và lời giải ngay.</p>'+
   '<select id="sp"><option value="1">Đủ thời gian gõ</option><option value="0.6" selected>Rút ngắn thời gian (60%)</option><option value="0.3">Rút ngắn nhiều (30%)</option></select>'+
   '<button class="btn" id="go">Bắt đầu</button></div>'+
   '<ul class="rlist">'+R+'</ul></div>';
  document.querySelectorAll("[data-r]").forEach(function(c){c.onchange=function(){
    picked=[].slice.call(document.querySelectorAll("[data-r]")).filter(function(x){return x.checked}).map(function(x){return +x.dataset.r});
    document.getElementById("go").disabled=!picked.length}});
  document.getElementById("go").onclick=function(){speed=+document.getElementById("sp").value; start(picked.slice())};
}

async function start(rounds){
  var rules=speed===1?O.RULES_WEB:O.scaleRules(O.RULES_WEB,speed,true);
  eng=O.createEngine({hub:hub(),makePlan:async function(){return O.buildPlan(1)},rules:rules});
  var r=await eng.createRoom({name:"Bạn",useAI:false}); code=r.code; meId=r.playerId;
  eng.setConnected(code,meId,true);
  eng.start(code,meId,{rounds:rounds});
}

function me(){return st.players.find(function(p){return p.id===meId})}
function nm(id){var p=st.players.find(function(p){return p.id===id});return p?p.name:"?"}

// ---------------------------------------------------------------- render
function onState(){
  renderChrome();
  var m=me(), q=st.question, c=st.cnv;
  var sig=[st.phase,st.stage,st.roundIndex,q&&q.id,st.buzzWinnerId,st.activePlayerId,st.pack&&st.pack.index,
    c&&(c.currentRow+"|"+c.tilesOpen+"|"+c.solved+"|"+c.rows.map(function(r){return r.status}).join()),
    st.reveal&&st.reveal.answer,m.answered,m.lockedOut,m.cnvLocked,st.matchNo,st.notice].join("~");
  if(sig!==lastSig){lastSig=sig;renderMain();}
}
function renderChrome(){
  var ord=O.ROUND_ORDER.map(function(k){return O.ROUND_LABEL[k]});
  $rounds.innerHTML=picked.map(function(i){var cls=st.phase==="finished"||(st.round&&i<st.roundIndex)?"done":(st.round&&i===st.roundIndex?"on":"");return'<div class="'+cls+'">'+ord[i]+'</div>'}).join("");
  $rounds.style.gridTemplateColumns="repeat("+picked.length+",minmax(0,1fr))";
  $seats.innerHTML='<div class="plate"><span>Điểm của bạn</span><b class="sc gt">'+me().score+'</b><button class="btn ghost" id="quit">Thoát</button></div>';
  bind("quit",lobby);
}
function timerHtml(){return'<div class="tline"><div class="bar" id="bar"><i></i></div><div class="time" id="tm"></div></div>'}

function renderMain(){
  var h="", m=me();
  if(st.phase==="preparing"||st.phase==="lobby"){$main.innerHTML='<div class="card center">Đang chuẩn bị bộ câu hỏi…</div>';return;}
  if(st.phase==="intro"){
    $main.innerHTML='<div class="card center" style="padding:40px 18px"><h2 class="big gt">'+esc(st.intro.title)+'</h2><p class="hint" style="font-size:15px;max-width:520px;margin:0 auto">'+esc(st.intro.subtitle)+'</p><div><button class="btn ghost" id="skip">Bỏ qua</button></div></div>';
    bind("skip",function(){eng.skip(code,meId)});return;
  }
  if(st.phase==="finished"){finishedView();return;}
  if(st.phase==="pick"){
    if(st.activePlayerId===meId){
      var vals=[20,20,20],star=null;
      $main.innerHTML='<div class="card">'+timerHtml()+'<h3 class="gt" style="font-size:24px">Chọn gói 3 câu và Ngôi sao hy vọng</h3><p class="hint" style="text-align:left">Ngôi sao nhân đôi điểm nếu đúng, mất điểm gốc nếu sai.</p><div class="pick" id="pk"></div><div><button class="btn" id="ok">Xác nhận</button></div></div>';
      var draw=function(){document.getElementById("pk").innerHTML=vals.map(function(v,i){return'<div><b style="width:56px">Câu '+(i+1)+'</b>'+[20,30].map(function(x){return'<button class="btn '+(v===x?'':'ghost')+'" data-v="'+i+':'+x+'">'+x+' đ</button>'}).join("")+'<button class="btn '+(star===i?'':'ghost')+'" data-s="'+i+'" aria-label="Ngôi sao hy vọng">★ Ngôi sao</button></div>'}).join("");
        document.querySelectorAll("[data-v]").forEach(function(b){b.onclick=function(){var a=b.dataset.v.split(":");vals[+a[0]]=+a[1];draw()}});
        document.querySelectorAll("[data-s]").forEach(function(b){b.onclick=function(){var i=+b.dataset.s;star=star===i?null:i;draw()}});};
      draw();bind("ok",function(){eng.pick(code,meId,vals,star)});
    } else $main.innerHTML='<div class="card center">'+timerHtml()+'<p>'+esc(nm(st.activePlayerId))+' đang chọn gói câu hỏi…</p></div>';
    return;
  }
  var c=st.cnv, q=st.question;
  if(st.round==="vuot-chuong-ngai-vat"&&c){ cnvView(c); return; }
  if(!q){ $main.innerHTML='<div class="card center">…</div>'; return; }
  h+='<div class="card"><div class="meta"><b>Câu '+st.questionNumber+(st.questionCount?'/'+st.questionCount:'')+'</b><span class="chip">'+O.ROUND_LABEL[st.round]+'</span><span class="chip">'+O.CATEGORY_LABEL[q.category]+'</span>'+(q.star?'<span class="chip">★ Ngôi sao hy vọng</span>':'')+'<span class="pts">'+ptsLabel(q)+'</span></div>';
  h+='<p class="q">'+esc(q.content)+'</p>';
  if(q.media) h+='<img class="qimg" alt="Hình của câu hỏi" src="'+q.media+'">';
  if(q.items) h+='<ol class="items">'+q.items.map(function(t,i){return'<li><b>'+String.fromCharCode(65+i)+'.</b>'+esc(t)+'</li>'}).join("")+'</ol>';
  if(st.phase==="question"){ h+=timerHtml()+tvNote()+actionHtml(); }
  h+='</div>';
  if(st.phase==="reveal") h+=revealHtml();
  $main.innerHTML=h; bindAction(); bindReveal();
}
function ptsLabel(q){ if(st.round==="tang-toc")return"40·30·20·10 đ"; if(st.round==="khoi-dong")return"10 đ"; return q.points+(q.star?"×2":"")+" đ"; }

function tvNote(){
  var k=O.RULES_WEB.khoiDong.shown, t="";
  if(st.round!=="khoi-dong") return "";
  if(st.stage==="solo") t="Bạn có "+k.soloS+" giây để gõ. Thi thật trên truyền hình chỉ có "+k.tvSoloS+" giây.";
  else if(st.stage==="general") t="Thi thật: sau "+k.tvNoBuzzS+" giây không ai bấm chuông, MC công bố đáp án. Bản web cho "+k.noBuzzS+" giây.";
  else if(st.stage==="general-answer") t="Bạn có "+k.answerS+" giây để gõ. Thi thật trên truyền hình là "+k.tvAnswerS+" giây.";
  return t?'<p class="hint" style="margin:0">'+t+'</p>':"";
}
function actionHtml(){

// ---------------------------------------------------------------- vòng nguyệt quế quanh khung nội dung
(function(){
  var fr=document.getElementById("frame"), svg=document.getElementById("lau"), NS="http://www.w3.org/2000/svg", raf=0, lw=0, lh=0;
  function el(n,a){var e=document.createElementNS(NS,n);for(var k in a)e.setAttribute(k,a[k]);return e}
  function draw(){
    var w=fr.clientWidth,h=fr.clientHeight; if(w===lw&&h===lh) return; lw=w;lh=h;
    svg.setAttribute("width",w);svg.setAttribute("height",h);svg.setAttribute("viewBox","0 0 "+w+" "+h);
    while(svg.firstChild) svg.removeChild(svg.firstChild);
    var d=el("defs",{}), g=el("linearGradient",{id:"lg",gradientUnits:"userSpaceOnUse",x1:0,y1:0,x2:0,y2:h});
    [["0","#FFE9A8"],[".55","#F2BE48"],["1","#B7791F"]].forEach(function(o){g.appendChild(el("stop",{offset:o[0],"stop-color":o[1]}))});
    d.appendChild(g); svg.appendChild(d);
    var narrow=w<520, ins=narrow?11:15, r=narrow?18:26, cx=w/2, L=narrow?11:15;
    function path(m){ // m=-1 trái, +1 phải
      var X=function(x){return m<0?x:w-x};
      return"M"+X(cx-26)+" "+(h-ins)+" H"+X(ins+r)+" Q"+X(ins)+" "+(h-ins)+" "+X(ins)+" "+(h-ins-r)+" V"+(ins+r)+" Q"+X(ins)+" "+ins+" "+X(ins+r)+" "+ins+" H"+X(cx-62);
    }
    [-1,1].forEach(function(m){
      var p=el("path",{d:path(m),fill:"none",stroke:"url(#lg)","stroke-width":1.6,"stroke-linecap":"round"}); svg.appendChild(p);
      var len=p.getTotalLength(), step=L*1.15;
      for(var t=6;t<len-4;t+=step){
        var a=p.getPointAtLength(t), b=p.getPointAtLength(Math.min(len,t+2)), ang=Math.atan2(b.y-a.y,b.x-a.x)*180/Math.PI;
        var sz=L*(0.75+0.35*Math.sin(Math.PI*t/len));
        [-38,38].forEach(function(o){
          var lf=el("path",{d:"M0 0Q"+sz*.45+" "+(-sz*.3)+" "+sz+" 0Q"+sz*.45+" "+(sz*.3)+" 0 0Z",fill:"url(#lg)",transform:"translate("+a.x+" "+a.y+") rotate("+(ang+o)+")"});
          svg.appendChild(lf);
        });
      }
      // lá đầu cành
      var e=p.getPointAtLength(len), e2=p.getPointAtLength(len-2), ea=Math.atan2(e.y-e2.y,e.x-e2.x)*180/Math.PI;
      svg.appendChild(el("path",{d:"M0 0Q"+L*.5+" "+(-L*.35)+" "+L*1.2+" 0Q"+L*.5+" "+(L*.35)+" 0 0Z",fill:"url(#lg)",transform:"translate("+e.x+" "+e.y+") rotate("+ea+")"}));
    });
    // nơ buộc ở chân vòng
    svg.appendChild(el("circle",{cx:cx,cy:h-ins,r:4,fill:"url(#lg)"}));
  }
  function sched(){cancelAnimationFrame(raf);raf=requestAnimationFrame(draw)}
  if(window.ResizeObserver) new ResizeObserver(sched).observe(fr); else addEventListener("resize",sched);
  sched();
})();
// ---------------------------------------------------------------- nền: núi đa giác, hạt đỏ, vệt sáng
(function(){
  var cv=document.getElementById("bg"), cx=cv.getContext("2d"), W=0,H=0,dpr=Math.min(2,window.devicePixelRatio||1);
  var tris=[], parts=[], reduce=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
  function rng(seed){return function(){seed=(seed*16807)%2147483647;return(seed-1)/2147483646}}
  function build(){
    W=cv.width=innerWidth*dpr; H=cv.height=innerHeight*dpr; tris=[];
    var r=rng(7), cols=14, rows=5, hz=H*.74, pts=[];
    for(var j=0;j<=rows;j++){pts[j]=[];for(var i=0;i<=cols;i++){
      var x=(i/cols)*W*1.1-W*.05+(r()-.5)*W/cols*.6, base=j/rows;
      var ridge=Math.pow(Math.sin(i*.9+1)*.5+.5,1.4)*.6+Math.sin(i*2.3)*.12+.28;
      var y=hz-(1-base)*ridge*H*.34*(.5+r()*.8)+(r()-.5)*H*.02;
      pts[j][i]=[x,Math.min(y,hz)];
    }}
    for(var j=0;j<rows;j++)for(var i=0;i<cols;i++){
      var a=pts[j][i],b=pts[j][i+1],c=pts[j+1][i],d=pts[j+1][i+1];
      tris.push({p:[a,b,c],l:r(),ph:r()*6.28,k:j/rows});
      tris.push({p:[b,d,c],l:r(),ph:r()*6.28,k:j/rows});
    }
    parts=[];for(var n=0;n<70;n++)parts.push({x:Math.random()*W,y:Math.random()*H,s:(.6+Math.random()*1.6)*dpr,v:(8+Math.random()*22)*dpr,t:Math.random()*6.28});
  }
  function poly(t,tm,flip){
    var lum=t.l*.5+Math.sin(tm*.5+t.ph)*.12+.2+t.k*.18;
    var h=285+t.l*55-t.k*10, s=48+t.l*25, l=12+lum*34;
    cx.fillStyle="hsl("+h+","+s+"%,"+l+"%)";
    cx.beginPath();
    for(var i=0;i<3;i++){var p=t.p[i],y=flip?2*(H*.74)-p[1]:p[1]; i?cx.lineTo(p[0],y):cx.moveTo(p[0],y)}
    cx.closePath();cx.fill();
  }
  var t0=performance.now();
  function frame(now){
    var tm=reduce?0:(now-t0)/1000, hz=H*.74;
    var g=cx.createRadialGradient(W*.55,H*.28,0,W*.55,H*.28,H*.95);
    g.addColorStop(0,"#8A1F66");g.addColorStop(.45,"#4A0F4A");g.addColorStop(1,"#1A0623");
    cx.globalAlpha=1;cx.fillStyle=g;cx.fillRect(0,0,W,H);
    // vệt sáng chéo trôi chậm
    var sx=((tm*18)%(W*1.6))-W*.3;
    var lg=cx.createLinearGradient(sx,0,sx+W*.35,H*.55);
    lg.addColorStop(0,"rgba(255,230,180,0)");lg.addColorStop(.5,"rgba(255,230,180,.16)");lg.addColorStop(1,"rgba(255,230,180,0)");
    cx.strokeStyle=lg;cx.lineWidth=1.5*dpr;cx.beginPath();cx.moveTo(sx,0);cx.lineTo(sx+W*.35,H*.55);cx.stroke();
    for(var i=0;i<tris.length;i++)poly(tris[i],tm,false);
    // mặt sàn phản chiếu
    var fl=cx.createLinearGradient(0,hz,0,H);fl.addColorStop(0,"#2B0B35");fl.addColorStop(1,"#12041A");
    cx.fillStyle=fl;cx.fillRect(0,hz,W,H-hz);
    cx.save();cx.beginPath();cx.rect(0,hz,W,H-hz);cx.clip();cx.globalAlpha=.22;
    for(var i=0;i<tris.length;i++)poly(tris[i],tm,true);cx.restore();cx.globalAlpha=1;
    var hg=cx.createLinearGradient(0,hz-6*dpr,0,hz+30*dpr);hg.addColorStop(0,"rgba(255,170,90,.0)");hg.addColorStop(.2,"rgba(255,170,90,.22)");hg.addColorStop(1,"rgba(255,170,90,0)");
    cx.fillStyle=hg;cx.fillRect(0,hz-6*dpr,W,36*dpr);
    // hạt đỏ nhấp nháy bay lên
    for(var i=0;i<parts.length;i++){var p=parts[i];
      if(!reduce){p.y-=p.v*.016;p.x+=Math.sin(tm+p.t)*.2*dpr; if(p.y<-5){p.y=H*.8;p.x=Math.random()*W}}
      var a=.35+.65*Math.abs(Math.sin(tm*1.3+p.t));
      cx.fillStyle="rgba(255,70,60,"+a.toFixed(2)+")";cx.beginPath();cx.arc(p.x,p.y,p.s,0,6.283);cx.fill();}
    if(!reduce) requestAnimationFrame(frame);
  }
  build();requestAnimationFrame(frame);
  addEventListener("resize",function(){build();if(reduce)requestAnimationFrame(frame)});
})();
