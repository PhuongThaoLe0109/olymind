name: Thu thập câu hỏi

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: harvest
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: olymmind
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - name: Sinh và đối chiếu câu mới
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HARVEST_COUNT: "28"
          HARVEST_DAILY_MAX: "400"
        run: npx tsx scripts/harvest.ts
      - name: Lưu vào kho
        run: |
          if [ -n "$(git status --porcelain data/pool.json)" ]; then
            git config user.name "olymmind-bot"
            git config user.email "olymmind-bot@users.noreply.github.com"
            git add data/pool.json
            git commit -m "Thêm câu hỏi mới vào kho"
            git pull --rebase
            git push
          fi
